<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      (function() {
        // 1. Prevent Vite dev client from failing to connect to HMR WebSocket in proxy/iframe environment
        if (typeof window !== 'undefined' && window.WebSocket) {
          const OrigWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            const isViteHmr = 
              protocols === 'vite-hmr' || 
              (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
              (typeof url === 'string' && (url.includes('vite') || url.includes('/@vite/')));

            if (isViteHmr) {
              const listeners = {};
              const dummySocket = {
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                readyState: 1, // OPEN
                url: String(url),
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                addEventListener: function(event, callback) {
                  if (!listeners[event]) listeners[event] = [];
                  listeners[event].push(callback);
                  if (event === 'open') {
                    setTimeout(function() {
                      try {
                        if (dummySocket.onopen) dummySocket.onopen({ type: 'open' });
                        callback({ type: 'open' });
                      } catch (e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(event, callback) {
                  if (!listeners[event]) return;
                  listeners[event] = listeners[event].filter(function(cb) { return cb !== callback; });
                },
                dispatchEvent: function() {
                  return true;
                },
                send: function() {},
                close: function() {
                  dummySocket.readyState = 3;
                }
              };
              return dummySocket;
            }

            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // 2. Intercept console logs matching WebSocket or [vite]
        ['error', 'warn', 'info', 'log'].forEach(function(method) {
          const orig = console[method];
          if (!orig) return;
          console[method] = function(...args) {
            const isViteWs = args.some(function(arg) {
              if (!arg) return false;
              const str = typeof arg === 'object' ? (arg.message || arg.stack || '') : String(arg);
              return str.includes('WebSocket') || str.includes('[vite]') || str.includes('closed without opened');
            });
            if (isViteWs) {
              return;
            }
            orig.apply(console, args);
          };
        });

        // 3. Catch uncaught exceptions from @vite/client
        window.onerror = function(msg, url, line, col, error) {
          const isViteWs = 
            (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('[vite]') || msg.includes('closed without opened'))) ||
            (typeof url === 'string' && url.includes('@vite/client')) ||
            (error && (String(error.message).includes('WebSocket') || String(error.message).includes('[vite]') || String(error.stack).includes('@vite/client')));

          if (isViteWs) {
            return true;
          }
        };

        window.addEventListener('error', function(event) {
          const isViteWs = 
            (event.filename && event.filename.includes('@vite/client')) ||
            (event.message && (event.message.includes('WebSocket') || event.message.includes('[vite]') || event.message.includes('closed without opened'))) ||
            (event.error && (String(event.error.message).includes('WebSocket') || String(event.error.message).includes('[vite]') || String(event.error.stack).includes('@vite/client')));

          if (isViteWs) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          const reason = event.reason;
          if (reason && (String(reason).includes('WebSocket') || String(reason).includes('[vite]') || String(reason.message).includes('WebSocket') || String(reason.message).includes('closed without opened'))) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <title>FamPlay - Family Multi-Gaming Arcade</title>
