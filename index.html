<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FamPlay - Family Multi-Gaming Arcade</title>
    <meta name="description" content="Cross-platform family gaming platform with 100+ card & board games, integrated voice chat, leaderboards, parental controls, tournaments, custom avatars, and multi-language support." />
    <meta property="og:title" content="FamPlay - Family Multi-Gaming Arcade" />
    <meta property="og:description" content="Cross-platform family gaming platform with 100+ card & board games, integrated voice chat, leaderboards, parental controls, tournaments, custom avatars, and multi-language support." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FamPlay" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://brettspiele-online.eu/" />
    <meta property="og:url" content="https://brettspiele-online.eu/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          if (
            window.self === window.top &&
            window.location.hostname !== 'brettspiele-online.eu' &&
            window.location.hostname !== 'localhost' &&
            window.location.hostname !== '127.0.0.1' &&
            !window.location.search.includes('no_redirect=1')
          ) {
            window.location.replace('https://brettspiele-online.eu/' + window.location.search + window.location.hash);
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-900 font-sans">
    <div id="root"></div>

  </body>
</html>
